# Проверка шабашек каждые ~10 минут. Работает в облаке GitHub — ноутбук может быть выключен.
# Сторонних actions нет: только git, curl и pip из стандартного образа Ubuntu.
#
# Как устроен «будильник»: расписание GitHub для новых аккаунтов часто не срабатывает часами,
# поэтому каждая проверка в конце сама заказывает следующую (workflow_dispatch от GITHUB_TOKEN —
# так GitHub разрешает). Паузу ~9 минут держит окружение «timer» с таймером ожидания:
# пока таймер тикает, сервер не занят. Расписание ниже — запасное: перезапустит цепочку, если она оборвётся.
#
# Права разделены: «poll» видит секрет бота, но может только читать репозиторий;
# «save» пишет ветку state, но секрета не видит; «next» умеет только заказать следующую проверку.
name: "Шабашки: проверка"

on:
  schedule:
    - cron: "17 * * * *"   # запасной будильник раз в час (время UTC; GitHub может задерживать)
  workflow_dispatch:
    inputs:
      wait:
        description: "служебное: 1 — подождать ~9 минут перед проверкой"
        required: false
        default: "0"
        type: string

permissions: {}

concurrency:
  group: shabashki   # никогда не запускаем две копии одновременно (иначе Telegram выкинет сессию)
  cancel-in-progress: false
  queue: max         # ожидающий «вход» не отменяется следующей проверкой

jobs:
  timer:
    # только для запусков из цепочки: ждём таймер окружения «timer» (~9 минут), сервер в это время не занят
    if: inputs.wait == '1'
    runs-on: ubuntu-24.04
    environment: timer
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "пауза закончилась — проверяю каналы"

  poll:
    needs: timer
    if: ${{ !cancelled() && needs.timer.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read   # только читать код и ветку state
      models: read     # бесплатная нейросеть GitHub Models
    outputs:
      state: ${{ steps.run.outputs.state }}
    steps:
      - name: Код и состояние
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q app && cd app
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD
          # ветка state: есть → обязаны её прочитать; нет (код 2) → первый запуск; любая другая ошибка → стоп
          rc=0; git ls-remote --exit-code --heads origin state >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch -q --depth=1 origin state
            git show FETCH_HEAD:state.bin > state.bin
            [ -s state.bin ] || { echo "ветка state пустая — останавливаюсь, чтобы ничего не затереть"; exit 1; }
          elif [ "$rc" -ne 2 ]; then
            echo "не смог проверить ветку state (код $rc) — останавливаюсь"; exit 1
          fi

      - name: Библиотеки (версии и хэши зафиксированы)
        working-directory: app
        run: |
          set -euo pipefail
          for py in python3 /opt/hostedtoolcache/Python/3.12*/x64/bin/python3; do "$py" -m venv .venv && break; done
          .venv/bin/pip install -q --disable-pip-version-check --no-deps --require-hashes -r requirements-build.txt
          .venv/bin/pip install -q --disable-pip-version-check --no-deps --require-hashes --no-build-isolation -r requirements.txt

      - name: Проверить чаты и прислать шабашки
        id: run
        working-directory: app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HOME_COORDS: ${{ secrets.HOME_COORDS }}
          FOLDER: ${{ secrets.FOLDER }}
          CHANNELS: ${{ secrets.CHANNELS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python -m shabashki poll
          if [ -s state.bin ]; then echo "state=$(base64 -w0 state.bin)" >> "$GITHUB_OUTPUT"; fi

  save:
    needs: poll
    if: ${{ !cancelled() && needs.poll.result == 'success' && needs.poll.outputs.state != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Сохранить состояние (зашифрованное) в ветку state
        env:
          STATE_B64: ${{ needs.poll.outputs.state }}
        run: |
          set -euo pipefail
          [[ "$STATE_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo "состояние в неверном формате"; exit 1; }
          mkdir st && cd st
          printf '%s' "$STATE_B64" | base64 -d > state.bin
          [ "$(head -c 4 state.bin)" = "SHB1" ] || { echo "это не наш файл состояния"; exit 1; }
          git init -q && git checkout -q -b state && git add state.bin
          git -c user.name=shabashki-bot -c user.email=actions@users.noreply.github.com commit -qm "state"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" state

      - name: Не дать GitHub усыпить расписание
        # GitHub отключает расписание в публичном репо после 60 дней без активности — раз в ~50 дней пустой коммит
        run: |
          set -euo pipefail
          git init -q keep && cd keep
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git -c user.name=shabashki-bot -c user.email=actions@users.noreply.github.com commit -q --allow-empty -m "keepalive"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "keepalive не удался (не страшно)"
          fi

  next:
    # заказать следующую проверку через ~10 минут; если другая уже ждёт в очереди — вторую цепочку не плодим
    needs: [timer, poll, save]
    if: ${{ !cancelled() && needs.timer.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      WAITED: ${{ inputs.wait }}
    steps:
      - name: Заказать следующую проверку
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/bot.yml"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          # сколько запусков уже ждёт своей очереди и сколько секунд идёт этот запуск
          info=$(curl -fsS --retry 3 "${hdr[@]}" "${api}/runs?per_page=20" | python3 -c '
          import datetime as dt, json, os, sys
          runs = json.load(sys.stdin).get("workflow_runs", [])
          me = int(os.environ["RUN_ID"])
          busy = sum(1 for r in runs if r["id"] != me and r["status"] in ("queued", "pending", "waiting", "requested", "in_progress"))
          age = 9999
          for r in runs:
              if r["id"] == me and r.get("run_started_at"):
                  start = dt.datetime.fromisoformat(r["run_started_at"].replace("Z", "+00:00"))
                  age = int((dt.datetime.now(dt.timezone.utc) - start).total_seconds())
          print(busy, age)') || info="0 9999"
          read -r busy age <<<"${info}"
          if [ "${busy}" -gt 0 ]; then echo "следующая проверка уже заказана"; exit 0; fi
          if [ "${WAITED}" = "1" ] && [ "${age}" -lt 300 ]; then
            # окружение timer потеряло паузу — не крутимся без остановки, ждём запасное расписание
            echo "пауза не сработала — цепочку останавливаю"; exit 1
          fi
          for i in 1 2 3; do
            if curl -fsS "${hdr[@]}" -H "Content-Type: application/json" -X POST "${api}/dispatches" \
                -d '{"ref":"main","inputs":{"wait":"1"}}'; then
              echo "следующая проверка — примерно через 10 минут"; exit 0
            fi
            sleep 10
          done
          echo "не смог заказать следующую проверку — цепочку перезапустит запасное расписание"; exit 1
